<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buy Me a Coffee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="coffee-page">
      <section class="coffee-card">
        <p class="eyebrow">Support my work</p>
        <h1>Buy me a coffee</h1>
        <p class="subtitle">
          If this project has helped you, a small donation helps me keep building and improving it.
        </p>

        <div class="coffee-links">
          <a class="coffee-btn primary" href="https://buymeacoffee.com/theideamatser" target="_blank" rel="noopener noreferrer">
            Buy Me a Coffee
          </a>
          <a class="coffee-btn secondary" href="https://ko-fi.com/theideamatser" target="_blank" rel="noopener noreferrer">
            Ko-fi
          </a>
          <a class="coffee-btn secondary" href="https://www.paypal.com/donate?business=YOUR_PAYPAL_ID" target="_blank" rel="noopener noreferrer">
            PayPal
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
